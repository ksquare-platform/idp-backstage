apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/source-location: url:https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}/tree/main/
    backstage.io/techdocs-ref: dir:.
    ksquare.io/deploy-environments: |
      production: ci.yml@main
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
{% if values.system %}
  system: ${{ values.system }}
{% endif %}
