apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: new-service
  title: Create a new service
  description: >-
    The golden path for a brand-new service: creates the repo, CI, docs
    and catalog entry, and registers it in the portal. Restricted to
    platform-admins - see the catalog:service:create step and
    rbac/rbac-policy.csv.
spec:
  owner: group:default/platform-admins
  type: service

  parameters:
    - title: About the service
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Name
          type: string
          description: >-
            Unique, DNS-safe name - used as the repo name, the catalog
            entity name, and the Docker image name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: A short description of what this service does
        owner:
          title: Owner
          type: string
          description: Owner of the service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        system:
          title: System
          type: string
          description: Optional system this service belongs to
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: Where to create the new repository
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - ksquare-platform
        visibility:
          title: Visibility
          type: string
          description: Repository visibility
          enum:
            - private
            - public
          enumNames:
            - Private
            - Public
          default: private

  # The scaffolder wizard's own auto-generated final review step (showing
  # every value entered above before submission) serves as the third page
  # here - no separate empty "Review" parameters block is needed.
  steps:
    - id: authorize
      name: Check permission
      action: catalog:service:create

    - id: fetch-base
      name: Fetch base skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*.yml
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          ownerName: ${{ (parameters.owner | parseEntityRef).name }}
          system: ${{ parameters.system }}
          visibility: ${{ parameters.visibility }}
          repoUrl: ${{ parameters.repoUrl }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.visibility }}
        defaultBranch: main
        protectDefaultBranch: true
        deleteBranchOnMerge: true
        requireCodeOwnerReviews: true
        topics:
          - service

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: View CI run
        url: ${{ steps['publish'].output.remoteUrl }}/actions
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
