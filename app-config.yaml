app:
  title: Ksquare IDP
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Default landing page configuration.
    # The home page is the root page so it can introduce the portal and its
    # purpose. The catalog is still one click away in the sidebar.
    # - page:catalog:
    #     config:
    #       path: /

    # Replaced by the Ksquare IDP light/dark themes (see packages/app/src/theme).
    - theme:app/light: false
    - theme:app/dark: false

    - page:home:
        config:
          path: /
          defaultConfig:
            - component: PortalHero
              column: 0
              row: 0
              width: 12
              height: 3
              deletable: false
            - component: HomePageSearchBar
              column: 0
              row: 3
              width: 12
              height: 2
              deletable: false
            - component: QuickActions
              column: 0
              row: 5
              width: 12
              height: 4
            - component: HomePageStarredEntities
              column: 0
              row: 9
              width: 6
              height: 6
            - component: OwnedEntities
              column: 6
              row: 9
              width: 6
              height: 6
            - component: FeaturedTemplates
              column: 0
              row: 15
              width: 12
              height: 5

organization:
  name: The Ksquare Group

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection:
      directory: ./.data/db
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # GitHub sign-in user/group data. Single source of truth for login-able
    # users - the baked-in examples/github-org.yaml has been removed. New
    # users are appended here via a pull request by the "Onboard teammate"
    # template (examples/templates/onboard-user), not by hand-editing.
    - type: file
      target: ../../catalog/users.yaml
      rules:
        - allow: [User, Group]

    # Statically registered GitHub repos, loaded on every startup so they
    # don't need to be re-added via the "Analyze" / Register Existing flow.
    - type: url
      target: https://github.com/ksquare-platform/idp-backstage/blob/main/catalog-info.yaml
    - type: url
      target: https://github.com/Rupessh-Metra/JavaWebCalculator/blob/master/catalog-info.yaml

    # "Deploy to kind" template, runs the kubernetes:deploy scaffolder action
    - type: file
      target: ../../examples/templates/deploy-to-kind/template.yaml
      rules:
        - allow: [Template]

    # "Grant repo access" template, runs the github:repo:grant scaffolder action
    - type: file
      target: ../../examples/templates/grant-repo-access/template.yaml
      rules:
        - allow: [Template]

    # "Onboard teammate" template, runs the catalog:user:onboard scaffolder
    # action (platform-admins only - see rbac/rbac-policy.csv)
    - type: file
      target: ../../examples/templates/onboard-user/template.yaml
      rules:
        - allow: [Template]

    # "Onboard an existing repository" template, runs the
    # catalog:repo:onboard scaffolder action (platform-admins only - see
    # rbac/rbac-policy.csv)
    - type: file
      target: ../../examples/templates/onboard-repo/template.yaml
      rules:
        - allow: [Template]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options
  serviceLocatorMethod:
    type: multiTenant
  # The cluster list itself comes from a custom KubernetesClustersSupplier
  # (see packages/backend/src/kubernetes) that reads a kubeconfig file. Its
  # path is set via kubernetes.kubeconfigPath in app-config.local.yaml (or
  # the KUBECONFIG env var), since it's a local, machine-specific path.
  #
  # The kubernetes:deploy scaffolder action (see
  # packages/backend/src/kubernetes/deployAction.ts) also expects, in
  # app-config.local.yaml since it's a credential:
  #   kubernetes:
  #     dockerHub:
  #       username: <docker hub username>
  #       token: <docker hub access token>
  #       imagePullSecret: <name of the imagePullSecret in the cluster>

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true
  rbac:
    admin:
      # Full access regardless of any policy row - see also the
      # role:default/platform-admins role in rbac/rbac-policy.csv, which
      # grants the same access to the whole platform-admins group (not just
      # this one account).
      superUsers:
        - name: user:default/rupessh-metra
    # Resolved relative to the backend process's cwd (packages/backend), so
    # this file lives at packages/backend/rbac/rbac-policy.csv.
    policies-csv-file: ./rbac/rbac-policy.csv
    policyFileReload: true
    pluginsWithPermission:
      - catalog
      - scaffolder
      - permission
      - kubernetes
    # Casbin/CSV has no "every user" wildcard subject, so the third tier
    # from our previous custom policy ("any other authenticated user ->
    # read-only") is expressed here instead: every authenticated user gets
    # role:default/everyone in addition to whatever role(s) the CSV file
    # grants them.
    defaultPermissions:
      defaultRole: role:default/everyone
      basicPermissions:
        - permission: catalog-entity
          action: read
        - permission: catalog.location.read
          action: read
        - permission: scaffolder-template
          action: read

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
